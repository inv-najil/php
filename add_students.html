<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <h1 class="text-center mb-4">Register student</h1>
                <form>
                    <label for="name" id="name" class="form-label">Enter Name</label>
                    <input type="text" id="name" class="form-control" placeholder="enter student name" required>
                    <label for="registartion_number" id="reg_num" class="form-label">Enter Registartion
                        Number</label>
                    <input type="text" id="registartion_number" class="form-control" placeholder="format: REG-YYYY-NNNN"
                        required>
                    <label for="age" id="age" class="form-label">Age</label>
                    <input type="number" id="age" class="form-control" placeholder="Enter age" required>
                    <label for="phone" id="phone" class="form-label">Phone</label>
                    <input type="number" id="phone" class="form-control" placeholder="Enter phone number" required>
                    <label for="email" id="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control mb-4" placeholder="Enter email id" required>
                    <select id="course" class="form-control mb-4">
                        <option value="" disabled selected>Select a course</option>
                        <option>Btech</option>
                        <option>Mtech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                    <button type="submit" id="submit" class="btn btn-primary w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
